name: CME Control Center — pre-Layer-3
run-name: CME pre-Layer-3 — ${{ inputs.offer_name }}

on:
  workflow_dispatch:
    inputs:
      offer_name:
        description: "Target product name"
        type: string
        required: true
        default: "Fanttik V8 Mate Cordless Car Vacuum"
      product_type:
        description: "Product type used by Brain and QA"
        type: string
        required: true
        default: "cordless handheld car vacuum"
      target_photo_url:
        description: "Direct HTTPS image URL for the target product (not a store page)"
        type: string
        required: true
        default: "https://fanttik.com/cdn/shop/files/1_398f4029-90d1-435e-b46d-0bf5b5fbb777.jpg?v=1772094680&width=1600"
      verified_claims:
        description: "Comma-separated verified product claims only"
        type: string
        required: true
        default: "Cordless car vacuum"
      country:
        description: "TikTok ad market"
        type: choice
        options: ["US", "GB", "CA", "AU", "DE", "NL"]
        required: true
        default: "US"
      period:
        description: "TikTok Top Ads lookback period (days)"
        type: choice
        options: ["7", "30", "180"]
        required: true
        default: "30"
      keywords:
        description: "TikTok ad search terms, comma-separated"
        type: string
        required: true
        default: "car vacuum"
      find_requests:
        description: "SocialCrawl API request cap"
        type: number
        required: true
        default: 4
      find_max_ads:
        description: "Maximum candidate ads to inspect"
        type: number
        required: true
        default: 3
      shots:
        description: "Number of sequential frames to generate (1–6)"
        type: number
        required: true
        default: 1

permissions:
  contents: read

concurrency:
  group: cme-control-center-${{ github.ref }}
  cancel-in-progress: false

jobs:
  pre_layer3:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SOCIALCRAWL_API_KEY: ${{ secrets.SOCIALCRAWL_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      OFFER_NAME: ${{ inputs.offer_name }}
      PRODUCT_TYPE: ${{ inputs.product_type }}
      TARGET_PHOTO_URL: ${{ inputs.target_photo_url }}
      VERIFIED_CLAIMS: ${{ inputs.verified_claims }}
      FIND_COUNTRY: ${{ inputs.country }}
      FIND_PERIOD: ${{ inputs.period }}
      FIND_KEYWORDS: ${{ inputs.keywords }}
      FIND_REQUESTS: ${{ inputs.find_requests }}
      FIND_MAX_ADS: ${{ inputs.find_max_ads }}
      SHOTS: ${{ inputs.shots }}
    steps:
      - name: Check out selected branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install CME dependencies and source-analysis tools
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg tesseract-ocr

      - name: Validate Python syntax and configuration files
        run: |
          set -euo pipefail
          python -m compileall -q cme tests
          python - <<'PY'
          import json
          from pathlib import Path
          json.loads(Path("settings.example.json").read_text(encoding="utf-8"))
          json.loads(Path("adapters.json").read_text(encoding="utf-8"))
          print("Pre-Layer-3 workflow preflight PASS.")
          PY

      - name: Run FIND → ANALYZE → TRANSFER → FRAME QA
        id: pipeline
        run: python -m cme.github_pipeline

      - name: Upload full pre-Layer-3 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cme-control-center-output
          path: |
            out/
            cme-live-work/radar/production/
            cme-live-work/radar/calls.jsonl
          if-no-files-found: warn
          retention-days: 14
